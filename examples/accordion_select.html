<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>SC Test - Accordion Select</title>
    <script src="../dist/json-pollock.bundle.min.js"></script>
    <script>
      window.onload = async function () {
        // Load JSON data from the external file
        const response = await fetch('./accordion_select.json');
        const json = await response.json();

        /**
         * Schema is now loaded from accordion_select.json
         * */

        /**
         * Json Pollock Actions
         * */
        JsonPollock.registerAction("navigate", (data) => {
          alert(JSON.stringify(data));
        });

        JsonPollock.registerAction("link", (data) => {
          alert(JSON.stringify(data));
        });

        JsonPollock.registerAction("publishText", (data) => {
          alert(JSON.stringify(data));
        });

        /**
         * Rendering logic
         * */
        const elMultiple = JsonPollock.render(JSON.stringify(json));

        document.getElementById("content").appendChild(elMultiple);
      };
    </script>
  </head>

  <body>
    <h1>Accordion multi select example</h1>
    <div id="content" style="max-width: 1000px"></div>
  </body>
</html>
