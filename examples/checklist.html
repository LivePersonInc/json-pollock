<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8">

  <title>SC Test</title>
    <script src="../dist/json-pollock.bundle.min.js"></script>
    <script>
      window.onload = async function () {
        // Load JSON data from the external file
        const response = await fetch('./checklist.json');
        const json = await response.json();

      JsonPollock.registerAction('navigate', function (data) {
        alert(JSON.stringify(data));
      });

      JsonPollock.registerAction('link', function (data) {
        alert(JSON.stringify(data));
      });

      JsonPollock.registerAction('publishText', function (data) {
        alert(JSON.stringify(data));
      });

      JsonPollock.registerAction('checked', function (data) {
        alert(JSON.stringify(data));
      });

      JsonPollock.registerAction('submitAsText', function (data) {
        alert(JSON.stringify(data));
      });

      var el = JsonPollock.render(JSON.stringify(json));
      document.getElementById('content').appendChild(el);
    }
  </script>
</head>

<body>
  <div id='content'>
  </div>

</body>

</html>
