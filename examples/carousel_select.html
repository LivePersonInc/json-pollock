<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>SC Test - Carousel Select</title>
    <script src="../dist/json-pollock.bundle.min.js"></script>
    <script>
      window.onload = async function () {
        // Load JSON data from the external file
      const response = await fetch('./carousel_select.json');
      const json = await response.json();

        /**
         * Json Pollock Actions
         * */
        JsonPollock.registerAction("navigate", (data) => {
          alert(JSON.stringify(data));
        });

        JsonPollock.registerAction("link", (data) => {
          alert(JSON.stringify(data));
        });

        JsonPollock.registerAction("publishText", (data) => {
          alert(JSON.stringify(data));
          console.log("publishText", data);
        });

        JsonPollock.registerAction("select", (data) => {
          alert(JSON.stringify(data));
        });

        /**
         * Rendering logic
         * */
        const elMultiple = JsonPollock.render(JSON.stringify(json));
        const elMultiple2 = JsonPollock.render(JSON.stringify(json));

        document.getElementById("content").appendChild(elMultiple);
        document.getElementById("content-2").appendChild(elMultiple2);

        // const elSingle = JsonPollock.render(JSON.stringify(singleCard));
        // document.getElementById("content-single").appendChild(elSingle);
      };
    </script>
  </head>

  <body>
    <h1>Multi select example</h1>
    <div id="content" style="max-width: 300px"></div>

    <h1>Second Multi select example</h1>
    <p>
      Here's an example where the second multi-select shares the same name as
      the first. Consequently, the code will no longer search for the first
      multi-select and instead focus solely on this particular node.
    </p>
    <div id="content-2" style="max-width: 300px"></div>

    <!-- <h1>Single select example</h1>
    <div id="content-single" style="max-width: 300px"></div> -->
  </body>
</html>
